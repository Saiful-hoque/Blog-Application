{% extends 'base.html' %}
{% block title %}Edit Post - {{ post.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-3 text-warning"><i class="bi bi-pencil-square"></i> Edit Blog Post</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Blog Title <span class="text-danger">*</span></label>
                    {{ form.title }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Blog Content <span class="text-danger">*</span></label>
                    {{ form.content }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning px-4 fw-semibold">Update Post</button>
                    <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary px-3">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
