{% extends 'base.html' %}
{% block title %}Edit Comment - DevBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4 bg-white">
            <h4 class="fw-bold text-warning mb-3">Edit Comment</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.content }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning px-4 fw-semibold">Save Changes</button>
                    <a href="{% url 'post_detail' comment.post.pk %}" class="btn btn-secondary px-3">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
