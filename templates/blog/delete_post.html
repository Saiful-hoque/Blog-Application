{% extends 'base.html' %}
{% block title %}Delete Post - {{ post.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger border-2 p-4 text-center">
            <h3 class="fw-bold text-danger">Delete Confirmation</h3>
            <p class="text-secondary mt-2">
                Are you sure you want to permanently delete:
                <br><strong class="text-dark fs-5">"{{ post.title }}"</strong>?
            </p>
            <form method="post" class="mt-3 d-flex justify-content-center gap-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                <a href="{% url 'post_detail' post.pk %}" class="btn btn-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
