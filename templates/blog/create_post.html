{% extends 'base.html' %}
{% block title %}Create Blog Post - DevBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-3 text-primary"><i class="bi bi-plus-circle"></i> Create New Blog Post</h3>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Blog Title <span class="text-danger">*</span></label>
                    {{ form.title }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Blog Content <span class="text-danger">*</span></label>
                    {{ form.content }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success px-4">Publish Post</button>
                    <a href="{% url 'home' %}" class="btn btn-secondary px-3">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
