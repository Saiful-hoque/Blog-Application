{% extends 'base.html' %}
{% block title %}Login - DevBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <div class="text-center mb-3">
                <i class="bi bi-shield-lock-fill text-dark" style="font-size: 2.5rem;"></i>
                <h3 class="fw-bold mt-2">Account Login</h3>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Sign In</button>
            </form>
            <div class="text-center mt-3 border-top pt-3">
                <p class="small text-muted mb-0">Don't have an account? <a href="{% url 'register' %}">Register now</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
